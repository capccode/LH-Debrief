site_name: LH-Debrief
site_description: Speaker diarization, transcription, and AI analysis for meeting recordings
repo_url: https://github.com/capccode/LH-Debrief

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Getting Started: getting-started.md
  - Profiles: profiles.md
  - Blocks: blocks.md
  - Providers: providers.md
  - CLI Reference: cli-reference.md
  - API Reference: api-reference.md
  - Deployment: deployment.md
  - Desktop App: desktop.md
  - Contributing: contributing.md
