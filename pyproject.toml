[project]
name = "lh-debrief"
version = "0.1.0"
description = "Speaker diarization, transcription, and AI analysis for meeting recordings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyannote-audio>=3.1",
    "openai-whisper",
    "torch",
    "torchaudio",
    "python-dotenv",
    "rich",
    "anthropic>=0.75.0",
    "ollama",
    "commitizen>=4.13.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright>=1.1.407",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
per-file-ignores = {"src/diarize.py" = ["E402"], "src/audio.py" = ["E402"], "api/main.py" = ["E402"], "api/jobs.py" = ["E402"]}

[tool.pytest.ini_options]
pythonpath = ["src", "api"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = true
