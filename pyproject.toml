[project]
name = "lh-debrief"
version = "0.1.0"
description = "Speaker diarization, transcription, and AI analysis for meeting recordings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyannote-audio>=3.1",
    "openai-whisper",
    "torch",
    "torchaudio",
    "python-dotenv",
    "rich",
    "anthropic>=0.75.0",
    "ollama",
    "commitizen>=4.13.9",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright>=1.1.407",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
per-file-ignores = {"src/diarize.py" = ["E402"]}

[tool.pytest.ini_options]
pythonpath = ["src"]
